{%- assign c = site.data.company -%}
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{%- if page.url == "/" %}
<title>{{ page.title }}</title>
{%- else %}
<title>{{ page.title }} — LevIT</title>
{%- endif %}
<meta name="description" content="{{ page.description | default: page.summary | default: page.lead | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description | default: page.summary | default: page.lead | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css?v={{ site.time | date: '%s' }}">
</head>
<body class="{{ page.body_class }}">

{% include header.html %}

<main>
{{ content }}
{%- unless page.hide_form %}
{% include lead-section.html class=page.form_class %}
{%- endunless %}
</main>

{% include footer.html %}

<script>window.LEVIT = {endpoint: {{ c.form_endpoint | jsonify }}, email: {{ c.email | jsonify }}, phone: {{ c.phone | jsonify }}, telegram: {{ c.telegram | jsonify }}};</script>
<script src="/assets/js/main.js?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
