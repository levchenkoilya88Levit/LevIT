# Напрями супроводу BAS (1С). Кожен показується блоком на сторінці /poslugy/suprovid-bas/
# id — якір (посилання #id), points — список того, що входить.
- id: obsluhovuvannia
  icon: shield
  title: Комплексне обслуговування
  text: Постійний супровід облікової системи — стабільність, продуктивність, оновлення.
  points:
    - Регулярні роботи з базою та контроль її стану
    - Вирішення термінових питань у пріоритетному порядку
    - Плановий розвиток системи разом з вашим бізнесом
- id: rozrobka
  icon: code
  title: Розробка та доробка
  text: Звіти, документи, обробки та нові механізми під ваші бізнес-процеси.
  points:
    - Нові звіти та друковані форми
    - Обробки для автоматизації рутинних операцій
    - Доробка документів і механізмів конфігурації
- id: intehratsii
  icon: swap
  title: Інтеграції та синхронізації
  text: Обміни з сайтами, маркетплейсами, CRM, банками та службами доставки.
  points:
    - Індивідуальні обміни під вашу інфраструктуру
    - Налаштування та адаптація готових рішень
    - Контроль стабільності обмінів
- id: audyt
  icon: search
  title: Бізнес-аналіз і аудит
  text: Знаходимо причини помилок і гальмування, складаємо план робіт і ТЗ.
  points:
    - Аудит конфігурації та доробок
    - Опис бізнес-процесів і технічне завдання
    - План розвитку облікової системи
- id: tzd
  icon: phone
  title: Мобільні додатки та ТЗД
  text: Рішення для складу, транспортної логістики та роздрібу. Впровадження терміналів збору даних.
  points:
    - Підбір і підключення терміналів збору даних
    - Мобільні робочі місця для складу та роздрібу
    - Інвентаризація, приймання та відвантаження зі сканером
- id: perekhid-na-bas
  icon: arrow
  title: Перехід з 1С на BAS
  text: Перенесення даних, залишків і доробок з 1С:Підприємство на лінійку BAS.
  points:
    - Аналіз доробок і план переходу
    - Перенесення даних і залишків
    - Адаптація доробок до нової конфігурації
- id: pidtrymka
  icon: chat
  title: Підтримка користувачів
  text: Консультації співробітників, допомога з функціоналом, навчання.
  points:
    - Відповіді на питання користувачів
    - Навчання нових співробітників
    - Інструкції для типових операцій
- id: onovlennia
  icon: refresh
  title: Контроль оновлень
  text: Перевірка оновлень на сумісність із доробками та їх коректне встановлення.
  points:
    - Перевірка оновлень на тестовій копії
    - Збереження доробок після оновлення
    - Пояснення змін для користувачів
